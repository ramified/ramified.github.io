<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Lianliankan - Mosaic Calculator prototype</title>
  <link rel="stylesheet" href="lianliankan.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <a class="back-link" href="../mosaic_calculator.html">Mosaic Calculator</a>
      <h1>Lianliankan</h1>
    </div>
    <div class="game-controls" aria-label="Game setup">
      <label>
        <span>Rows</span>
        <input id="rows" type="number" min="2" max="12" step="1" value="6">
      </label>
      <label>
        <span>Columns</span>
        <input id="cols" type="number" min="2" max="12" step="1" value="8">
      </label>
      <label>
        <span>Topology</span>
        <select id="topology">
          <option value="torus" selected>Torus</option>
          <option value="klein">Klein bottle</option>
          <option value="open">Open boundary</option>
        </select>
      </label>
      <button class="command-button" id="new-game" type="button">New game</button>
    </div>
  </header>

  <main>
    <section class="status-band" aria-label="Game status">
      <p id="status" role="status" aria-live="polite">Preparing board</p>
      <div class="action-bar">
        <button class="icon-button" id="hint" type="button" title="Hint" aria-label="Show hint">?</button>
        <button class="icon-button" id="refresh" type="button" title="Refresh remaining tiles" aria-label="Refresh remaining tiles">&#8635;</button>
      </div>
    </section>

    <section class="board-stage" aria-label="Lianliankan board">
      <canvas id="game-canvas" width="960" height="640" tabindex="0" aria-label="Lianliankan tile board"></canvas>
    </section>

    <section class="metrics-band" aria-label="Game metrics">
      <dl>
        <div><dt>Tiles</dt><dd id="tile-count">0</dd></div>
        <div><dt>Matches</dt><dd id="match-count">0</dd></div>
        <div><dt>Refreshes</dt><dd id="refresh-count">0</dd></div>
        <div><dt>Surface</dt><dd id="surface-name">Torus</dd></div>
      </dl>
    </section>
  </main>

  <footer>
    <a href="README.md">Integration notes</a>
  </footer>

  <script src="lianliankan_engine.js"></script>
  <script src="mosaic_adapter.js"></script>
  <script src="lianliankan_app.js"></script>
</body>
</html>
