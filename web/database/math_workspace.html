<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathematical Workspace</title>
<link rel="stylesheet" href="css/site.css?v=20260903-1">
<link rel="stylesheet" href="css/import_export_panel.css?v=20260821-7">
<link rel="stylesheet" href="css/math_workspace.css?v=20261029-shortcut-close-alignment-1">
<link rel="stylesheet" href="css/ramified_theme.css">
</head>
<body class="ramified-theme">
<header>
  <h1>Mathematical Workspace</h1>
  <span><a href="index.html">Pure Math Toolkit</a> &middot; native workspace editors &middot; session Assets explorer</span>
</header>

<main class="math-workspace-layout">
  <section class="canvas-panel workspace-view-card" aria-label="Workspace view">
    <header class="panel-title workspace-panel-title">
      <span class="panel-title-text">Main · <span id="workspace-canvas-name">Choose a panel</span></span>
      <div class="workspace-canvas-controls">
        <label class="sr-only" for="workspace-open-canvas">Open panel in main area</label>
        <select id="workspace-open-canvas" class="workspace-canvas-picker workspace-control calculator-control" aria-label="Open panel in main area"></select>
        <button id="workspace-split-view" class="btn btn-ghost" type="button" aria-pressed="false" disabled>split view</button>
        <button id="workspace-settings" class="btn btn-ghost" type="button" aria-haspopup="dialog">Settings</button>
      </div>
    </header>
    <div id="workspace-canvas-tabs" class="workspace-canvas-tabs" role="tablist" aria-label="Opened panels"></div>
    <div id="workspace-canvas-panes" class="workspace-canvas-panes" data-split="false">
      <section id="workspace-canvas-pane-primary" class="workspace-canvas-pane" data-pane="primary" tabindex="0" aria-label="Primary canvas pane">
        <div class="workspace-canvas-pane-slot"></div>
      </section>
      <section id="workspace-canvas-pane-secondary" class="workspace-canvas-pane" data-pane="secondary" tabindex="0" aria-label="Secondary canvas pane" hidden>
        <div class="workspace-canvas-pane-slot"></div>
      </section>
    </div>
    <div id="workspace-canvas-resizer" class="workspace-canvas-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize focused canvas" aria-valuemin="240" aria-valuemax="1600" aria-valuenow="680" tabindex="0"></div>
    <div id="workspace-canvas-parking" hidden aria-hidden="true"></div>
  </section>

  <aside class="workspace-inspector" aria-label="Side panels">
    <div class="workspace-inspector-head">
      <h2>Panels</h2>
      <button id="workspace-add-card" class="btn btn-ghost workspace-add-card" type="button" aria-haspopup="dialog" aria-expanded="false">Add panel</button>
    </div>
    <div id="workspace-cards" class="workspace-cards">
    <section id="workspace-io-card" class="card workspace-io-card">
      <div id="workspace-io-head" class="card-head" role="button" tabindex="0" aria-expanded="true">
        <span class="drag-handle" aria-hidden="true">⋮⋮</span>
        <span class="card-head-label">Import / Export</span>
        <em class="toggle-icon">▾</em>
      </div>
      <div class="card-body">
        <span id="workspace-io-target" class="workspace-io-target">Choose a complete workspace backup, an asset, or a property.</span>
        <div class="import-export-panel">
          <div class="import-export-tabs" role="tablist" aria-label="Import and export">
            <button class="import-export-tab" type="button" role="tab" aria-selected="true" data-workspace-io-tab="export">Export</button>
            <button class="import-export-tab" type="button" role="tab" aria-selected="false" data-workspace-io-tab="import">Import</button>
          </div>
          <div id="workspace-io-export-panel" class="import-export-tabpanel" role="tabpanel">
            <label class="input-label" for="workspace-io-exporter">Export content</label>
            <select id="workspace-io-exporter" class="workspace-control calculator-control" aria-label="Export content"></select>
            <div id="workspace-io-format-row" hidden>
              <label class="input-label" for="workspace-io-format">Format</label>
              <select id="workspace-io-format" class="workspace-control calculator-control" aria-label="Export format"></select>
            </div>
            <div class="workspace-io-actions">
              <button id="workspace-io-export" class="btn" type="button" disabled>refresh</button>
              <button id="workspace-io-copy" class="btn btn-ghost" type="button" disabled>copy</button>
              <button id="workspace-io-download" class="btn btn-ghost" type="button" disabled>download</button>
            </div>
            <textarea id="workspace-io-output" class="workspace-io-output" readonly aria-label="Exported data"></textarea>
          </div>
          <div id="workspace-io-import-panel" class="import-export-tabpanel" role="tabpanel" hidden>
            <label class="input-label" for="workspace-io-importer">Import content</label>
            <select id="workspace-io-importer" class="workspace-control calculator-control" aria-label="Import content"></select>
            <label class="input-label" for="workspace-io-input">Imported data</label>
            <textarea id="workspace-io-input" class="workspace-io-input" placeholder="Paste exported data" spellcheck="false" disabled></textarea>
            <div class="workspace-io-actions"><button id="workspace-io-import" class="btn" type="button" disabled>import</button></div>
          </div>
          <p id="workspace-status" class="workspace-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>
    </div>
  </aside>
</main>

<div id="workspace-card-picker" class="workspace-card-picker" role="dialog" aria-label="Add panels" hidden>
  <p id="workspace-card-context" class="workspace-card-context" aria-live="polite"></p>
  <div id="workspace-card-options" class="workspace-card-options"></div>
</div>

<div id="workspace-assets-context-menu" class="workspace-assets-context-menu" role="menu" hidden></div>
<dialog id="workspace-assets-delete-dialog" class="workspace-assets-delete-dialog" aria-labelledby="workspace-assets-delete-title">
  <form method="dialog">
    <h2 id="workspace-assets-delete-title">Delete assets?</h2>
    <p id="workspace-assets-delete-summary"></p>
    <div id="workspace-assets-delete-selected"></div>
    <div id="workspace-assets-delete-dependents"></div>
    <div class="workspace-assets-dialog-actions">
      <button class="btn btn-ghost" value="cancel" type="submit">cancel</button>
      <button id="workspace-assets-delete-confirm" class="btn workspace-assets-delete-confirm" value="confirm" type="submit">delete</button>
    </div>
  </form>
</dialog>
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], processEscapes: true },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'input'] }
  };
</script>
