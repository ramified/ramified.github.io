name = "theorem-graph-personal"
main = "theorem-graph.worker.mjs"
compatibility_date = "2026-10-14"

[build]
command = "node build-theorem-graph-assets.mjs"

[assets]
directory = ".theorem-assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
ADMIN_USERNAME = "ramified"

[[d1_databases]]
binding = "DB"
database_name = "theorem-graph-personal"
# Replace with the ID returned by `wrangler d1 create theorem-graph-personal`.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
